name: Release

# Draft releases never trigger workflows, and assets can't be uploaded to an
# already-published release, so this workflow creates the release itself:
# push a version tag (or run manually with a tag input) to trigger it, it
# builds, creates a draft release, uploads assets, then publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New tag to create and release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pushing this tag re-triggers the workflow, which runs the publish job below
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      # strip leading 'v' from tag names like v1.2.3
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Pack UnionTypes.Toolkit
        run: >
          dotnet build src/UnionTypes/UnionTypes.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack UnionTypes.Toolkit.Generators
        run: >
          dotnet build src/SourceGenerators.Package/SourceGenerators.Package.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      # creates the release (if it doesn't exist) as a draft and uploads assets
      - name: Create draft release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            src/UnionTypes/bin/Release/*.nupkg
            src/SourceGenerators.Package/bin/Release/*.nupkg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
