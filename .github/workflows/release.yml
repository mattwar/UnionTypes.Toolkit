name: Release

# GitHub blocks asset uploads to a release once it's published, so this
# workflow runs while the release is still a draft, then publishes it.
on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach packages to (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      # strip leading 'v' from tag names like v1.2.3
      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Pack UnionTypes.Toolkit
        run: >
          dotnet build src/UnionTypes/UnionTypes.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack UnionTypes.Toolkit.Generators
        run: >
          dotnet build src/SourceGenerators.Package/SourceGenerators.Package.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            src/UnionTypes/bin/Release/*.nupkg
            src/SourceGenerators.Package/bin/Release/*.nupkg

      - name: Publish release
        if: github.event_name == 'release' && github.event.release.draft == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --repo "${{ github.repository }}"
